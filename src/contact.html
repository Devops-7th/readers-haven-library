<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readers' Haven - Contact</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="contact-page">
  <header>
    <h1>✉️ Contact &amp; Feedback</h1>
    <p>We would love to hear from you</p>
  </header>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="collections.html">Collections</a>
    <a href="membership.html">Membership</a>
    <a href="services.html">Services</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <main>
    <h2>Get in Touch</h2>
    <div class="grid-container">
      <div class="card">
        <h3>📍 Address</h3>
        <p>24 Canal View Road, Lahore</p>
      </div>
      <div class="card">
        <h3>📞 Phone</h3>
        <p>+92 42 111 555 000</p>
      </div>
      <div class="card">
        <h3>📧 Email</h3>
        <p>info@readershaven.example</p>
      </div>
    </div>
    <h2 class="form-title">Send Us Feedback</h2>
    <form class="feedback-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Readers' Haven Public Library - UCP DevOps Project</p>
  </footer>
</body>
</html>
